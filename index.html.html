<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Il Mio Jukebox</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0d0d0d;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }
    .jukebox-body {
      width: 100%;
      max-width: 380px;
      background: linear-gradient(180deg, #b30000 0%, #4a0000 100%);
      border: 6px solid #ffd700;
      border-radius: 120px 120px 20px 20px;
      padding: 25px 20px;
      box-shadow: 0 0 35px rgba(255, 0, 0, 0.6);
      text-align: center;
    }
    .neon-arch {
      width: 70%;
      height: 20px;
      margin: 0 auto 10px auto;
      border-top: 4px solid #00ffff;
      border-radius: 100px 100px 0 0;
      box-shadow: 0 -4px 10px #00ffff;
    }
    .brand-title {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 3px;
      color: #fff;
      text-shadow: 0 0 8px #ffd700, 0 0 15px #ff0000;
      margin-bottom: 15px;
    }
    .screen {
      background: #050505;
      border: 2px solid #00ffcc;
      border-radius: 6px;
      padding: 10px;
      color: #00ffcc;
      font-family: monospace;
      font-size: 12px;
      margin-bottom: 15px;
      min-height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .song-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 15px;
    }
    .song-btn {
      background: linear-gradient(145deg, #2b2b2b, #1a1a1a);
      color: #ffd700;
      border: 2px solid #ffd700;
      padding: 12px 15px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s;
    }
    .song-btn:hover {
      background: #ffd700;
      color: #000;
      box-shadow: 0 0 10px #ffd700;
    }
    .player-container {
      background: #000;
      border: 2px solid #ffd700;
      border-radius: 8px;
      padding: 10px;
    }
    audio {
      width: 100%;
      height: 35px;
    }
  </style>
</head>
<body>

  <div class="jukebox-body">
    <div class="neon-arch"></div>
    <div class="brand-title">JUKEBOX</div>

    <div class="screen" id="display">Premi un pulsante per ascoltare!</div>

    <div class="song-list">
      <button class="song-btn" onclick="playAudio('Brano Dimostrativo 1', 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3')">
        <span>01. Canzone Demo 1</span>
        <span>▶</span>
      </button>
      
      <button class="song-btn" onclick="playAudio('Brano Dimostrativo 2', 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3')">
        <span>02. Canzone Demo 2</span>
        <span>▶</span>
      </button>

      <button class="song-btn" onclick="playAudio('Brano Dimostrativo 3', 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3')">
        <span>03. Canzone Demo 3</span>
        <span>▶</span>
      </button>
    </div>

    <div class="player-container">
      <audio id="audio-player" controls></audio>
    </div>
  </div>

  <script>
    function playAudio(title, url) {
      const player = document.getElementById('audio-player');
      const display = document.getElementById('display');
      
      display.innerText = '▶ In riproduzione: ' + title;
      player.src = url;
      player.play();
    }
  </script>

</body>
</html>
