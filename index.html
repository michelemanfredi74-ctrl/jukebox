<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jukebox 80-90 & Italian Hits</title>
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }

    body {
      background-color: #0d0d0d;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }

    .jukebox-body {
      width: 100%;
      max-width: 480px;
      background: linear-gradient(180deg, #b30000 0%, #4a0000 100%);
      border: 5px solid #ffd700;
      border-radius: 30px;
      padding: 20px 15px;
      box-shadow: 0 0 30px rgba(255, 0, 0, 0.6);
      text-align: center;
    }

    .brand-title {
      font-size: clamp(20px, 5vw, 26px);
      font-weight: 900;
      letter-spacing: 2px;
      color: #fff;
      text-shadow: 0 0 8px #ffd700, 0 0 15px #ff0000;
      margin-bottom: 15px;
    }

    .screen {
      background: #000;
      border: 2px solid #00ffcc;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      box-shadow: inset 0 0 10px rgba(0, 255, 204, 0.3);
      margin-bottom: 15px;
    }

    .screen iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .section-title {
      color: #ffd700;
      font-size: 13px;
      font-weight: bold;
      margin-top: 10px;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .song-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      max-height: 280px;
      overflow-y: auto;
      padding-right: 5px;
    }

    .song-grid::-webkit-scrollbar {
      width: 6px;
    }
    .song-grid::-webkit-scrollbar-thumb {
      background: #ffd700;
      border-radius: 4px;
    }

    .song-btn {
      background: #1a1a1a;
      color: #fff;
      border: 2px solid #ffd700;
      border-radius: 8px;
      padding: 10px 8px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      line-height: 1.2;
    }

    .song-btn:hover {
      background: #ffd700;
      color: #000;
      transform: translateY(-2px);
    }

    .song-btn:active {
      transform: scale(0.96);
    }

    @media (max-width: 360px) {
      .song-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="jukebox-body">
    <div class="brand-title">📻 JUKEBOX 80-90 📼</div>

    <div class="screen">
      <iframe id="yt-player" src="https://www.youtube.com/embed/fJ9rUzIMcZQ?enablejsapi=1" allow="autoplay; encrypted-media; accelerometer; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>

    <div class="section-title">🎵 SELEZIONA UNA CANZONE</div>

    <div class="song-grid">
      <!-- QUEEN -->
      <button class="song-btn" onclick="playYouTube('fJ9rUzIMcZQ')">▶ Bohemian Rhapsody (Queen)</button>
      <button class="song-btn" onclick="playYouTube('HgzGwKwLmgM')">▶ Don't Stop Me Now (Queen)</button>
      <button class="song-btn" onclick="playYouTube('-tJYN-eG1zk')">▶ We Will Rock You (Queen)</button>
      <button class="song-btn" onclick="playYouTube('04854XqPbcU')">▶ We Are The Champions (Queen)</button>

      <!-- VASCO ROSSI -->
      <button class="song-btn" onclick="playYouTube('w34GToO_xN8')">▶ Albachiara (Vasco Rossi)</button>
      <button class="song-btn" onclick="playYouTube('GjM2X0v5CzA')">▶ Vita Spericolata (Vasco Rossi)</button>      <button class="song-btn" onclick="playYouTube('L_vE2f_oJ38')">▶ Rewind (Vasco Rossi)</button>

      <!-- 883 -->
      <button class="song-btn" onclick="playYouTube('84BqLInqCno')">▶ Hanno Ucciso L'Uomo Ragno (883)</button>
      <button class="song-btn" onclick="playYouTube('oD9c68YqK6U')">▶ Nord Sud Ovest Est (883)</button>
      <button class="song-btn" onclick="playYouTube('M3E99p91E7E')">▶ Come Mai (883)</button>

      <!-- LIGABUE -->
      <button class="song-btn" onclick="playYouTube('4p4_W9zM1zU')">▶ Certe Notti (Ligabue)</button>
      <button class="song-btn" onclick="playYouTube('P3a5eO2F-K4')">▶ Urlando Contro il Cielo (Ligabue)</button>

      <!-- EROS RAMAZZOTTI -->
      <button class="song-btn" onclick="playYouTube('b2AqO6E5SGE')">▶ Più Bella Cosa (E. Ramazzotti)</button>
      <button class="song-btn" onclick="playYouTube('qQ3q_DqX7zA')">▶ Se Bastasse Una Canzone (Eros)</button>

      <!-- LÙNAPOP -->
      <button class="song-btn" onclick="playYouTube('5p29yUaJ8yU')">▶ 50 Special (Lùnapop)</button>

      <!-- MASSIMO RANIERI & GINO PAOLI -->
      <button class="song-btn" onclick="playYouTube('N8x_Qd9t8E8')">▶ Perdere L'Amore (M. Ranieri)</button>
      <button class="song-btn" onclick="playYouTube('3L6Q0p_y7fU')">▶ Sapore Di Sale (Gino Paoli)</button>

      <!-- CLASSICI DANCE 80-90 -->
      <button class="song-btn" onclick="playYouTube('djV11Xbc914')">▶ Take On Me (A-ha)</button>
      <button class="song-btn" onclick="playYouTube('68ugkg9Re48')">▶ Blue (Eiffel 65)</button>
      <button class="song-btn" onclick="playYouTube('1k8craCGwV4')">▶ L'Amour Toujours (Gigi D'Ag)</button>
    </div>
  </div>

  <script>
    function playYouTube(videoId) {
      const player = document.getElementById('yt-player');
      player.src = "https://www.youtube.com/embed/" + videoId + "?autoplay=1&mute=0";
    }
  </script>

</body>
</html>
