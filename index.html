<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jukebox YouTube</title>
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }

    body {
      background-color: #0d0d0d;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }

    /* Contenitore flessibile e responsive */
    .jukebox-body {
      width: 100%;
      max-width: 480px; /* Si allarga sui PC, si adatta sugli smartphone */
      background: linear-gradient(180deg, #b30000 0%, #4a0000 100%);
      border: 5px solid #ffd700;
      border-radius: 30px;
      padding: 20px 15px;
      box-shadow: 0 0 30px rgba(255, 0, 0, 0.6);
      text-align: center;
    }

    .brand-title {
      font-size: clamp(20px, 5vw, 28px); /* Adatta la dimensione del testo allo schermo */
      font-weight: 900;
      letter-spacing: 2px;
      color: #fff;
      text-shadow: 0 0 8px #ffd700, 0 0 15px #ff0000;
      margin-bottom: 15px;
    }

    /* Layout della barra di ricerca responsive */
    .search-box {
      display: flex;
      flex-direction: row;
      gap: 8px;
      margin-bottom: 15px;
    }

    .search-box input {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: 2px solid #ffd700;
      background: #1a1a1a;
      color: #fff;
      font-size: 14px;
      outline: none;
      min-width: 0; /* Impedisce al campo di testo di sbordare nei dispositivi piccoli */
    }

    .search-box input::placeholder {
      color: #aaa;
    }

    .search-box button {
      padding: 12px 16px;
      background: #ffd700;
      color: #000;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      white-space: nowrap;
    }

    .search-box button:hover {
      background: #ffe44d;
    }

    .search-box button:active {
      transform: scale(0.96);
    }

    /* Schermo in 16:9 perfettamente adattabile */
    .screen {
      background: #000;
      border: 2px solid #00ffcc;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* Mantiene sempre la proporzione 16:9 */
      box-shadow: inset 0 0 10px rgba(0, 255, 204, 0.3);
    }

    .screen iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Adattamenti specifici per schermi molto piccoli */
    @media (max-width: 360px) {
      .jukebox-body {
        padding: 15px 10px;
        border-radius: 20px;
      }

      .search-box {
        flex-direction: column; /* Mette tasto e input uno sotto l'altro nei telefoni molto stretti */
      }

      .search-box button {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="jukebox-body">
    <div class="brand-title">JUKEBOX YT</div>

    <!-- Barra per incollare il link -->
    <div class="search-box">
      <input type="text" id="linkInput" placeholder="Incolla link di YouTube qui..." onkeypress="handleKeyPress(event)">
      <button onclick="playFromLink()">▶ Suona</button>
    </div>

    <!-- Schermo del Jukebox -->
    <div class="screen">
      <iframe id="yt-player" src="https://www.youtube-nocookie.com/embed/8C_D1x3aL8E?autoplay=0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>
  </div>

  <script>
    function playYouTube(videoId) {
      const player = document.getElementById('yt-player');
      player.src = "https://www.youtube-nocookie.com/embed/" + videoId + "?autoplay=1";
    }

    function playFromLink() {
      const input = document.getElementById('linkInput').value.trim();
      let videoId = "";

      if (input.includes("youtu.be/")) {
        videoId = input.split("youtu.be/")[1].split("?")[0];
      } else if (input.includes("v=")) {
        videoId = input.split("v=")[1].split("&")[0];
      } else {
        videoId = input;
      }

      if (videoId !== "") {
        playYouTube(videoId);
      }
    }

    // Permette di premere Invio dalla tastiera dello smartphone o PC per far partire la musica
    function handleKeyPress(event) {
      if (event.key === 'Enter') {
        playFromLink();
      }
    }
  </script>

</body>
</html>
