<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Jukebox YouTube</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0d0d0d;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }
    .jukebox-body {
      width: 100%;
      max-width: 420px;
      background: linear-gradient(180deg, #b30000 0%, #4a0000 100%);
      border: 6px solid #ffd700;
      border-radius: 40px;
      padding: 25px 20px;
      box-shadow: 0 0 35px rgba(255, 0, 0, 0.6);
      text-align: center;
    }
    .brand-title {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 3px;
      color: #fff;
      text-shadow: 0 0 8px #ffd700, 0 0 15px #ff0000;
      margin-bottom: 15px;
    }
    .search-box {
      display: flex;
      gap: 5px;
      margin-bottom: 15px;
    }
    .search-box input {
      flex: 1;
      padding: 10px;
      border-radius: 6px;
      border: 2px solid #ffd700;
      background: #1a1a1a;
      color: #fff;
      font-size: 12px;
    }
    .search-box button {
      padding: 10px 12px;
      background: #ffd700;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    .screen {
      background: #000;
      border: 2px solid #00ffcc;
      border-radius: 8px;
      overflow: hidden;
      aspect-ratio: 16 / 9;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <div class="jukebox-body">
    <div class="brand-title">JUKEBOX YT</div>

    <!-- Barra per incollare il link -->
    <div class="search-box">
      <input type="text" id="linkInput" placeholder="Incolla link di YouTube qui...">
      <button onclick="playFromLink()">▶ Suona</button>
    </div>

    <!-- Schermo del Jukebox -->
    <div class="screen">
      <iframe id="yt-player" src="https://www.youtube-nocookie.com/embed/8C_D1x3aL8E?autoplay=0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>
  </div>

  <script>
    function playYouTube(videoId) {
      const player = document.getElementById('yt-player');
      player.src = "https://www.youtube-nocookie.com/embed/" + videoId + "?autoplay=1";
    }

    function playFromLink() {
      const input = document.getElementById('linkInput').value.trim();
      let videoId = "";

      if (input.includes("youtu.be/")) {
        videoId = input.split("youtu.be/")[1].split("?")[0];
      } else if (input.includes("v=")) {
        videoId = input.split("v=")[1].split("&")[0];
      } else {
        videoId = input;
      }

      if (videoId !== "") {
        playYouTube(videoId);
      }
    }
  </script>

</body>
</html>
