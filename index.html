<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jukebox 80-90 & Italian Hits</title>
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }

    body {
      background-color: #0d0d0d;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }

    .jukebox-body {
      width: 100%;
      max-width: 480px;
      background: linear-gradient(180deg, #b30000 0%, #4a0000 100%);
      border: 5px solid #ffd700;
      border-radius: 30px;
      padding: 20px 15px;
      box-shadow: 0 0 30px rgba(255, 0, 0, 0.6);
      text-align: center;
    }

    .brand-title {
      font-size: clamp(20px, 5vw, 26px);
      font-weight: 900;
      letter-spacing: 2px;
      color: #fff;
      text-shadow: 0 0 8px #ffd700, 0 0 15px #ff0000;
      margin-bottom: 15px;
    }

    .screen {
      background: #000;
      border: 2px solid #00ffcc;
      border-radius: 12px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 120px;
      box-shadow: inset 0 0 10px rgba(0, 255, 204, 0.3);
      margin-bottom: 15px;
    }

    .now-playing {
      color: #00ffcc;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    audio {
      width: 100%;
      max-width: 350px;
      height: 40px;
    }

    .section-title {
      color: #ffd700;
      font-size: 13px;
      font-weight: bold;
      margin-top: 10px;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .song-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 320px;
      overflow-y: auto;
      padding-right: 5px;
    }

    .song-grid::-webkit-scrollbar {
      width: 6px;
    }
    .song-grid::-webkit-scrollbar-thumb {
      background: #ffd700;
      border-radius: 4px;
    }

    .song-btn {
      background: #1a1a1a;
      color: #fff;
      border: 2px solid #ffd700;
      border-radius: 12px;
      padding: 12px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .song-btn:hover {
      background: #ffd700;
      color: #000;
    }

    .song-btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="jukebox-body">
    <div class="brand-title">📻 JUKEBOX 80-90 📼</div>

    <div class="screen">
      <div class="now-playing" id="track-title">Seleziona un brano</div>
      <audio id="audio-player" controls></audio>
    </div>

    <div class="section-title">🎵 SELEZIONA UNA CANZONE</div>

    <div class="song-grid">
      <!-- Sostituisci i link .mp3 con i tuoi file audio preferiti -->
      <button class="song-btn" onclick="playAudio('Queen - We Are The Champions', 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3')">▶ We Are The Champions (Queen)</button>
      <button class="song-btn" onclick="playAudio('883 - Hanno Ucciso L\'Uomo Ragno', 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3')">▶ Hanno Ucciso L'Uomo Ragno (883)</button>
      <button class="song-btn" onclick="playAudio('883 - Nord Sud Ovest Est', 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3')">▶ Nord Sud Ovest Est (883)</button>
      <button class="song-btn" onclick="playAudio('883 - Come Mai', 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3')">▶ Come Mai (883)</button>
      <button class="song-btn" onclick="playAudio('Vasco Rossi - Albachiara', 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3')">▶ Albachiara (Vasco Rossi)</button>
    </div>
  </div>

  <script>
    function playAudio(title, url) {
      const player = document.getElementById('audio-player');
      const trackTitle = document.getElementById('track-title');
      
      trackTitle.innerText = "In riproduzione: " + title;
      player.src = url;
      player.play();
    }
  </script>

</body>
</html>
