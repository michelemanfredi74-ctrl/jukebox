<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jukebox 883 & Lùnapop</title>
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }

    body {
      background-color: #0d0d0d;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }

    /* Contenitore principale responsive stile Retrò */
    .jukebox-body {
      width: 100%;
      max-width: 480px;
      background: linear-gradient(180deg, #b30000 0%, #4a0000 100%);
      border: 5px solid #ffd700;
      border-radius: 30px;
      padding: 20px 15px;
      box-shadow: 0 0 30px rgba(255, 0, 0, 0.6);
      text-align: center;
    }

    .brand-title {
      font-size: clamp(20px, 5vw, 26px);
      font-weight: 900;
      letter-spacing: 2px;
      color: #fff;
      text-shadow: 0 0 8px #ffd700, 0 0 15px #ff0000;
      margin-bottom: 15px;
    }

    /* Schermo 16:9 responsive */
    .screen {
      background: #000;
      border: 2px solid #00ffcc;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      box-shadow: inset 0 0 10px rgba(0, 255, 204, 0.3);
      margin-bottom: 15px;
    }

    .screen iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .section-title {
      color: #ffd700;
      font-size: 13px;
      font-weight: bold;
      margin-top: 10px;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Griglia di pulsanti scrollabile */
    .song-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      max-height: 260px;
      overflow-y: auto;
      padding-right: 5px;
    }

    /* Barra di scorrimento dorata */
    .song-grid::-webkit-scrollbar {
      width: 6px;
    }
    .song-grid::-webkit-scrollbar-thumb {
      background: #ffd700;
      border-radius: 4px;
    }

    .song-btn {
      background: #1a1a1a;
      color: #fff;
      border: 2px solid #ffd700;
      border-radius: 8px;
      padding: 10px 8px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      line-height: 1.2;
    }

    .song-btn:hover {
      background: #ffd700;
      color: #000;
      transform: translateY(-2px);
    }

    .song-btn:active {
      transform: scale(0.96);
    }

    @media (max-width: 360px) {
      .song-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="jukebox-body">
    <div class="brand-title">📻 JUKEBOX 80-90 📼</div>

    <!-- Schermo del Jukebox -->
    <div class="screen">
      <iframe id="yt-player" src="https://www.youtube.com/embed/AZbd2q5M8g0?autoplay=0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>

    <div class="section-title">🎵 SELEZIONA UNA CANZONE</div>

    <!-- Lista Pulsanti -->
    <div class="song-grid">
      <!-- 883 -->
      <button class="song-btn" onclick="playYouTube('AZbd2q5M8g0')">▶ Hanno Ucciso L'Uomo Ragno (883)</button>
      <button class="song-btn" onclick="playYouTube('E36tC07mYj4')">▶ Hanno Ucciso L'Uomo Ragno (Originale)</button>
      <button class="song-btn" onclick="playYouTube('7L8_sI7M-0A')">▶ Nord Sud Ovest Est (883)</button>
      <button class="song-btn" onclick="playYouTube('38s1I2m214c')">▶ Sei Un Mito (883)</button>
      <button class="song-btn" onclick="playYouTube('S3JmXnI7fEE')">▶ Come Mai (883)</button>
      <button class="song-btn" onclick="playYouTube('Q8L_30R_Rxs')">▶ La Regola dell'Amico (883)</button>
      <button class="song-btn" onclick="playYouTube('8j8XpL2mR5o')">▶ Gli Anni (883)</button>
      
      <!-- LÙNAPOP -->
      <button class="song-btn" onclick="playYouTube('eW1O4jO1Wc8')">▶ 50 Special (Lùnapop)</button>
      <button class="song-btn" onclick="playYouTube('987l2Wq34S0')">▶ Un Giorno Migliore (Lùnapop)</button>
      <button class="song-btn" onclick="playYouTube('1_7K8aP865M')">▶ Qualcosa di Grande (Lùnapop)</button>
      <button class="song-btn" onclick="playYouTube('4a3K9sW2a0Y')">▶ Vespa Special (Lùnapop)</button>

      <!-- ALTRI CLASSICI 80-90 -->
      <button class="song-btn" onclick="playYouTube('djV11Xbc914')">▶ Take On Me (A-ha)</button>
      <button class="song-btn" onclick="playYouTube('p3l7fgvrEKM')">▶ Blue (Eiffel 65)</button>
      <button class="song-btn" onclick="playYouTube('1k8craCGwV4')">▶ L'Amour Toujours (Gigi D'Ag)</button>
    </div>
  </div>

  <script>
    function playYouTube(videoId) {
      const player = document.getElementById('yt-player');
      player.src = "https://www.youtube.com/embed/" + videoId + "?autoplay=1";
    }
  </script>

</body>
</html>
