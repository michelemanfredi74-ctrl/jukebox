<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jukebox 80-90 & Italian Hits</title>
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }

    body {
      background-color: #0d0d0d;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }

    .jukebox-body {
      width: 100%;
      max-width: 480px;
      background: linear-gradient(180deg, #b30000 0%, #4a0000 100%);
      border: 5px solid #ffd700;
      border-radius: 25px;
      padding: 18px 14px;
      box-shadow: 0 0 25px rgba(255, 0, 0, 0.5);
      text-align: center;
    }

    .brand-title {
      font-size: clamp(18px, 4.5vw, 24px);
      font-weight: 900;
      letter-spacing: 2px;
      color: #fff;
      text-shadow: 0 0 8px #ffd700, 0 0 15px #ff0000;
      margin-bottom: 12px;
    }

    .screen {
      background: #000;
      border: 2px solid #00ffcc;
      border-radius: 12px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 15px rgba(0, 255, 204, 0.2);
      margin-bottom: 15px;
    }

    .now-playing {
      color: #00ffcc;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 8px;
      text-transform: uppercase;
      word-break: break-word;
      text-shadow: 0 0 5px #00ffcc;
      min-height: 20px;
    }

    .player-container {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #111;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 4px;
      border: 1px solid #333;
    }

    #yt-player {
      width: 100%;
      height: 100%;
    }

    .section-title {
      color: #ffd700;
      font-size: 12px;
      font-weight: bold;
      margin-top: 5px;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .song-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 260px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .song-grid::-webkit-scrollbar {
      width: 6px;
    }
    .song-grid::-webkit-scrollbar-thumb {
      background: #ffd700;
      border-radius: 4px;
    }

    .song-btn {
      background: #1a1a1a;
      color: #fff;
      border: 2px solid #ffd700;
      border-radius: 10px;
      padding: 10px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .song-btn:hover {
      background: #ffd700;
      color: #000;
    }

    .song-btn.active {
      background: #ffd700;
      color: #000;
      box-shadow: 0 0 10px #ffd700;
    }

    .song-btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="jukebox-body">
    <div class="brand-title">📻 JUKEBOX 80-90 📼</div>

    <div class="screen">
      <div class="now-playing" id="track-title">Seleziona un brano sotto</div>
      
      <div class="player-container">
        <div id="yt-player"></div>
      </div>
    </div>

    <div class="section-title">🎵 SELEZIONE BRANI</div>

    <div class="song-grid">
      <button class="song-btn" onclick="playTrack(this, 'Queen - We Are The Champions', 'fJ9rUzIMcZQ')">▶ Queen - We Are The Champions</button>
      <button class="song-btn" onclick="playTrack(this, '883 - Hanno Ucciso L\'Uomo Ragno', 'N3P6fK2L8w8')">▶ 883 - Hanno Ucciso L'Uomo Ragno</button>
      <button class="song-btn" onclick="playTrack(this, '883 - Nord Sud Ovest Est', '8C_D1x3aL8E')">▶ 883 - Nord Sud Ovest Est</button>
      <button class="song-btn" onclick="playTrack(this, '883 - Come Mai', 'S3JmXnI7fEE')">▶ 883 - Come Mai</button>
      <button class="song-btn" onclick="playTrack(this, '883 - Gli Anni', '8j8XpL2mR5o')">▶ 883 - Gli Anni</button>
      <button class="song-btn" onclick="playTrack(this, '883 - Sei Un Mito', '38s1I2m214c')">▶ 883 - Sei Un Mito</button>
      <button class="song-btn" onclick="playTrack(this, 'Vasco Rossi - Albachiara', 'u38Y_E3k34w')">▶ Vasco Rossi - Albachiara</button>
      <button class="song-btn" onclick="playTrack(this, 'Vasco Rossi - Vita Spericolata', '1_7_s_w7h0A')">▶ Vasco Rossi - Vita Spericolata</button>
      <button class="song-btn" onclick="playTrack(this, 'Vasco Rossi - Rewind', '2m5lS25Xy34')">▶ Vasco Rossi - Rewind</button>
      <button class="song-btn" onclick="playTrack(this, 'Vasco Rossi - Sally', 'p3k5qW_8W2E')">▶ Vasco Rossi - Sally</button>
      <button class="song-btn" onclick="playTrack(this, 'Ligabue - Urlando Contro il Cielo', 'P3a5eO2F-K4')">▶ Ligabue - Urlando Contro il Cielo</button>
      <button class="song-btn" onclick="playTrack(this, 'Eros Ramazzotti - Più Bella Cosa', 'b2AqO6E5SGE')">▶ Eros Ramazzotti - Più Bella Cosa</button>
      <button class="song-btn" onclick="playTrack(this, 'Eros Ramazzotti - Se Bastasse Una Canzone', 'qQ3q_DqX7zA')">▶ Eros Ramazzotti - Se Bastasse Una Canzone</button>
      <button class="song-btn" onclick="playTesto('Renato Zero - I Migliori Anni', 'zcASGUV8L4g')">▶ Renato Zero - I Migliori Anni</button>
      <button class="song-btn" onclick="playTrack(this, 'Eiffel 65 - Blue', '68ugkg9Re48')">▶ Eiffel 65 - Blue</button>
    </div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    let player;

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('yt-player', {
        height: '100%',
        width: '100%',
        videoId: '',
        playerVars: {
          'playsinline': 1,
          'controls': 1,
          'rel': 0,
          'autoplay': 1
        }
      });
    }

    function playTrack(btnElement, title, videoId) {
      document.querySelectorAll('.song-btn').forEach(btn => btn.classList.remove('active'));
      if (btnElement) btnElement.classList.add('active');

      document.getElementById('track-title').innerText = title;

      if (player && typeof player.loadVideoById === 'function') {
        player.loadVideoById(videoId);
      }
    }
  </script>

</body>
</html>
