<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Jukebox YouTube</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0d0d0d;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }
    .jukebox-body {
      width: 100%;
      max-width: 420px;
      background: linear-gradient(180deg, #b30000 0%, #4a0000 100%);
      border: 6px solid #ffd700;
      border-radius: 40px;
      padding: 25px 20px;
      box-shadow: 0 0 35px rgba(255, 0, 0, 0.6);
      text-align: center;
    }
    .brand-title {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 3px;
      color: #fff;
      text-shadow: 0 0 8px #ffd700, 0 0 15px #ff0000;
      margin-bottom: 15px;
    }
    .search-box {
      display: flex;
      gap: 5px;
      margin-bottom: 15px;
    }
    .search-box input {
      flex: 1;
      padding: 10px;
      border-radius: 6px;
      border: 2px solid #ffd700;
      background: #1a1a1a;
      color: #fff;
      font-size: 13px;
    }
    .search-box button {
      padding: 10px 15px;
      background: #ffd700;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    .screen {
      background: #000;
      border: 2px solid #00ffcc;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 15px;
      aspect-ratio: 16 / 9;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .song-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 180px;
      overflow-y: auto;
    }
    .song-btn {
      background: linear-gradient(145deg, #2b2b2b, #1a1a1a);
      color: #ffd700;
      border: 1px solid #ffd700;
      padding: 10px 12px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .song-btn:hover {
      background: #ffd700;
      color: #000;
    }
  </style>
</head>
<body>

  <div class="jukebox-body">
    <div class="brand-title">JUKEBOX YT</div>

    <!-- Barra di ricerca -->
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Cerca qualsiasi canzone o artista...">
      <button onclick="searchSong()">🔍 Cerca</button>
    </div>

    <!-- Schermo del Jukebox -->
    <div class="screen">
      <iframe id="yt-player" src="https://www.youtube.com/embed/dQw4w9WgXcQ" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>

    <!-- Selezione rapida -->
    <div class="song-list">
      <button class="song-btn" onclick="playYouTube('8C_D1x3aL8E')">
        <span>01. 883 - Nord Sud Ovest Est</span>
        <span>▶</span>
      </button>

      <button class="song-btn" onclick="playYouTube('dQw4w9WgXcQ')">
        <span>02. Never Gonna Give You Up</span>
        <span>▶</span>
      </button>
      
      <button class="song-btn" onclick="playYouTube('L_jWHffIx5E')">
        <span>03. Smash Mouth - All Star</span>
        <span>▶</span>
      </button>

      <button class="song-btn" onclick="playYouTube('fJ9rUzIMcZQ')">
        <span>04. Queen - Bohemian Rhapsody</span>
        <span>▶</span>
      </button>
    </div>
  </div>

  <script>
    function playYouTube(videoId) {
      const player = document.getElementById('yt-player');
      player.src = "https://www.youtube.com/embed/" + videoId + "?autoplay=1";
    }

    function searchSong() {
      const query = document.getElementById('searchInput').value;
      if (query.trim() !== "") {
        // Apre direttamente la ricerca su YouTube in una nuova scheda
        window.open("https://www.youtube.com/results?search_query=" + encodeURIComponent(query), "_blank");
      }
    }
  </script>

</body>
</html>
